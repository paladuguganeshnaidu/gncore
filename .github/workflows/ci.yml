name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]
      - name: Run test suite
        run: python -m pytest -q
      - name: Verify offline authoring and catalog integrity
        run: |
          python scripts/build_catalog.py --check
          python scripts/build_evaluations.py --check
          python -m gncore audit
          python -m gncore evaluate --validate
      - name: Compile sources
        run: python -m compileall -q -x '(frontend_data|backend_data|unified_data)' src tests

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: "**/*.md"
          config: .markdownlint-cli2.jsonc
