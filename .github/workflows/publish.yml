name: Publish verified release assets to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Approved version already attached to its GitHub release
        required: true
        type: string
      confirm_publish:
        description: Owner approved publication of the reviewed artifacts
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    if: inputs.confirm_publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate release identity and exact-commit CI
        shell: bash
        run: |
          python -c 'import os,re; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:(?:a|b|rc)[0-9]+)?", os.environ["RELEASE_VERSION"])'
          git fetch origin "refs/tags/v${RELEASE_VERSION}:refs/tags/v${RELEASE_VERSION}"
          RELEASE_SHA=$(git rev-list -n 1 "v${RELEASE_VERSION}")
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${RELEASE_SHA}&event=push" > /tmp/release-runs.json
          python -c 'import json; runs=json.load(open("/tmp/release-runs.json"))["workflow_runs"]; assert any(r["name"]=="CI" and r["conclusion"]=="success" for r in runs), "Exact release commit must pass CI"'
      - name: Download approved immutable assets
        run: |
          mkdir release-assets
          gh release download "v${RELEASE_VERSION}" --repo "$GITHUB_REPOSITORY" --dir release-assets --pattern "gncore-${RELEASE_VERSION}-py3-none-any.whl" --pattern "gncore-${RELEASE_VERSION}.tar.gz" --pattern "gncore-${RELEASE_VERSION}-skills.zip" --pattern SHA256SUMS
          python scripts/verify_release_assets.py release-assets --version "$RELEASE_VERSION"
      - name: Validate and smoke-test the accepted wheel
        run: |
          python -m pip install twine
          mkdir dist
          cp "release-assets/gncore-${RELEASE_VERSION}-py3-none-any.whl" "release-assets/gncore-${RELEASE_VERSION}.tar.gz" dist/
          python -m twine check dist/*
          python -m venv /tmp/gncore-release-test
          /tmp/gncore-release-test/bin/python -m pip install --no-deps --no-compile "dist/gncore-${RELEASE_VERSION}-py3-none-any.whl"
          cd /tmp
          /tmp/gncore-release-test/bin/python -m gncore audit
          /tmp/gncore-release-test/bin/python -m gncore evaluate --validate
      - name: Publish the verified Python artifacts with the configured trusted identity
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: false
          attestations: true
