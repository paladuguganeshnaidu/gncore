name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    name: Verify and publish distribution
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test] build twine
      - name: Run tests
        run: python -m pytest -q
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Verify CLI and catalog
        run: |
          test "$(gncore version)" = "5.0.0"
          gncore list domains
          gncore list skills > /tmp/gncore-skills.txt
          test "$(wc -l < /tmp/gncore-skills.txt)" -eq 403
      - name: Build distributions
        run: python -m build
      - name: Verify distributions
        run: python -m twine check dist/*
      - name: Install and smoke-test wheel
        run: |
          python -m venv /tmp/gncore-wheel-test
          /tmp/gncore-wheel-test/bin/python -m pip install --no-deps dist/gncore-5.0.0-py3-none-any.whl
          test "$(/tmp/gncore-wheel-test/bin/gncore version)" = "5.0.0"
          /tmp/gncore-wheel-test/bin/python -c "from gncore import builtin_skills, list_domains; assert len(builtin_skills()) == 403; assert len(list_domains()) == 30; assert all(len(domain.skill_ids) == 10 for domain in list_domains())"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
          skip-existing: true
          attestations: false
