[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gncore"
version = "7.0.0"
description = "Developer-focused AI skills for software, machine learning, neural networks and systems engineering."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT AND Apache-2.0 AND CC-BY-4.0 AND CC-BY-SA-4.0" }
authors = [
    { name = "Ganesh Naidu" }
]
keywords = [
    "ai",
    "skills",
    "assistant",
    "skill-library",
    "machine-learning",
    "agent-skills",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
gncore = "gncore.cli.app:main"

[project.optional-dependencies]
test = ["pytest>=8.2"]
skills = ["PyYAML>=6"]

[project.urls]
Homepage = "https://gncore.pages.dev"
Repository = "https://github.com/paladuguganeshnaidu/gncore"
Documentation = "https://github.com/paladuguganeshnaidu/gncore/tree/v7.0.0/docs"
"Bug Tracker" = "https://github.com/paladuguganeshnaidu/gncore/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gncore"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/ARCHITECTURE.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/docs",
    "/LICENSE",
    "/MIGRATION.md",
    "/SECURITY.md",
    "/VERIFIED_MODE.md",
    "/website-commands.txt",
    "/pyproject.toml",
    "/scripts",
    "/catalog",
    "/web",
    "/src/gncore",
    "/tests",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
