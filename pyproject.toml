[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gncore"
version = "2.1.0"
description = "Dynamic AI Skill Orchestration Framework for markdown-driven agents, contexts, skills, and templates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Ganesh Naidu", email = "ganesh.naidu@example.com" }
]
keywords = [
    "ai",
    "llm",
    "prompt",
    "prompt-engineering",
    "workflow",
    "skills",
    "automation",
    "markdown",
    "orchestration"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["keyring>=25.0"]

[project.scripts]
gncore = "gncore.cli.app:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=4.0"]

[project.urls]
"Homepage" = "https://github.com/paladuguganeshnaidu/gncore"
"Repository" = "https://github.com/paladuguganeshnaidu/gncore"
"Documentation" = "https://github.com/paladuguganeshnaidu/gncore#readme"
"Bug Tracker" = "https://github.com/paladuguganeshnaidu/gncore/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
gncore = ["py.typed"]
ngcore = ["skills/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
