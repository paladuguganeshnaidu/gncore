[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gncore"
version = "6.0.0"
description = "A searchable Python catalog of portable AI agent skills."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT AND Apache-2.0 AND CC-BY-4.0 AND CC-BY-SA-4.0" }
authors = [
    { name = "Ganesh Naidu" }
]
keywords = [
    "ai",
    "skills",
    "assistant",
    "skill-library",
    "machine-learning",
    "agent-skills",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
gncore = "gncore.cli.app:main"

[project.optional-dependencies]
test = ["pytest>=8.2"]
skills = ["PyYAML>=6"]

[project.urls]
Homepage = "https://github.com/paladuguganeshnaidu/gncore"
Repository = "https://github.com/paladuguganeshnaidu/gncore"
Documentation = "https://github.com/paladuguganeshnaidu/gncore#readme"
"Bug Tracker" = "https://github.com/paladuguganeshnaidu/gncore/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gncore"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/ARCHITECTURE.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/docs",
    "/LICENSE",
    "/MIGRATION.md",
    "/SECURITY.md",
    "/VERIFIED_MODE.md",
    "/website-commands.txt",
    "/pyproject.toml",
    "/scripts/generate_skill_catalog.py",
    "/scripts/inspect_frontend_sources.py",
    "/scripts/stage_frontend_sources.py",
    "/scripts/build_frontend_suite.py",
    "/scripts/backend_requests.py",
    "/scripts/import_backend_sources.py",
    "/scripts/build_backend_suite.py",
    "/scripts/category_blueprints.py",
    "/scripts/frontend_playbook.md",
    "/scripts/research_categories.py",
    "/scripts/download_category_candidates.py",
    "/scripts/recover_category_sources.py",
    "/scripts/build_unified_categories.py",
    "/scripts/install_categories.py",
    "/src/gncore",
    "/tests",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
