[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gncore"
version = "3.0.0"
description = "Universal AI Skill Installer for coding assistants."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ganesh Naidu", email = "ganesh.naidu@example.com" }
]
keywords = [
    "ai",
    "skills",
    "assistant",
    "installer",
    "claude",
    "copilot",
    "cursor",
    "windsurf",
    "continue",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
gncore = "gncore.cli.app:main"

[project.optional-dependencies]
test = ["pytest>=8.2"]

[project.urls]
Homepage = "https://github.com/paladuguganeshnaidu/gncore"
Repository = "https://github.com/paladuguganeshnaidu/gncore"
Documentation = "https://github.com/paladuguganeshnaidu/gncore#readme"
"Bug Tracker" = "https://github.com/paladuguganeshnaidu/gncore/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gncore"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/ARCHITECTURE.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/docs",
    "/LICENSE",
    "/MIGRATION.md",
    "/SECURITY.md",
    "/VERIFIED_MODE.md",
    "/pyproject.toml",
    "/src/gncore",
    "/tests",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
