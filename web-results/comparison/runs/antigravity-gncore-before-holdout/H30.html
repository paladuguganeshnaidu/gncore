<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summit Workshop Registration</title>
  <style>
    :root {
      --bg-canvas: #0b0f17;
      --bg-surface: #131b26;
      --border-subtle: #233142;
      --border-focus: #06b6d4;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --btn-disabled: #1e293b;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .container {
      width: 100%;
      max-width: 440px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .badge {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    .description {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }
    select, input[type="email"] {
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: var(--bg-canvas);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    select:focus, input[type="email"]:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.2);
    }
    .slots-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .slot-label {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem;
      background-color: var(--bg-canvas);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      transition: all 0.2s;
      min-height: 44px;
    }
    .slot-label:has(input:checked) {
      border-color: var(--accent-cyan);
      background-color: rgba(6, 182, 212, 0.1);
      color: var(--accent-cyan);
      font-weight: 600;
    }
    .slot-label:has(input:focus-visible) {
      outline: 2px solid var(--accent-cyan);
      outline-offset: 2px;
    }
    .slot-label input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    button[type="submit"] {
      width: 100%;
      padding: 0.85rem;
      margin-top: 0.75rem;
      background-color: var(--accent-cyan);
      color: #04121a;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
      transition: opacity 0.2s, background-color 0.2s;
    }
    button[type="submit"]:disabled {
      background-color: var(--btn-disabled);
      color: var(--text-muted);
      cursor: not-allowed;
      opacity: 0.7;
    }
    button[type="submit"]:focus-visible {
      outline: 2px solid var(--accent-cyan);
      outline-offset: 2px;
    }
    .confirmation-card {
      display: none;
      margin-top: 1.5rem;
      padding: 1rem;
      background-color: rgba(16, 185, 129, 0.08);
      border: 1px solid var(--accent-green);
      border-radius: 6px;
    }
    .confirmation-card.visible {
      display: block;
    }
    .confirmation-card h2 {
      font-size: 1rem;
      color: var(--accent-green);
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .confirmation-card p {
      font-size: 0.875rem;
      color: var(--text-main);
    }
    @media (max-width: 390px) {
      body { padding: 0.5rem; }
      .container { padding: 1.25rem; }
      h1 { font-size: 1.25rem; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="badge">Security Engineering Summit</div>
    <h1>Register for Session</h1>
    <p class="description">Select an executive workshop and technical session slot.</p>

    <form id="booking-form" novalidate>
      <div class="form-group">
        <label for="workshop">Workshop</label>
        <select id="workshop" required>
          <option value="" disabled selected>Choose a workshop</option>
          <option value="Threat Modeling">Threat Modeling</option>
          <option value="Secure APIs">Secure APIs</option>
        </select>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="engineer@enterprise.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label id="slot-group-label">Slot</label>
        <div class="slots-container" role="radiogroup" aria-labelledby="slot-group-label">
          <label class="slot-label">
            <input type="radio" name="slot" value="10:30">
            10:30
          </label>
          <label class="slot-label">
            <input type="radio" name="slot" value="16:00">
            16:00
          </label>
        </div>
      </div>

      <button type="submit" id="book-btn" disabled>Book Workshop</button>
    </form>

    <div id="confirmation" class="confirmation-card" role="status" aria-live="polite">
      <h2>Registration Confirmed</h2>
      <p id="confirmation-text"></p>
    </div>
  </main>

  <script>
    (function() {
      const form = document.getElementById('booking-form');
      const workshop = document.getElementById('workshop');
      const email = document.getElementById('email');
      const slotInputs = document.querySelectorAll('input[name="slot"]');
      const bookBtn = document.getElementById('book-btn');
      const confirmation = document.getElementById('confirmation');
      const confirmationText = document.getElementById('confirmation-text');

      function isValidEmail(val) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val.trim());
      }

      function validateForm() {
        const hasWorkshop = workshop.value !== '';
        const hasValidEmail = isValidEmail(email.value);
        let hasSlot = false;
        for (const input of slotInputs) {
          if (input.checked) { hasSlot = true; break; }
        }
        bookBtn.disabled = !(hasWorkshop && hasValidEmail && hasSlot);
      }

      workshop.addEventListener('change', validateForm);
      email.addEventListener('input', validateForm);
      slotInputs.forEach(input => input.addEventListener('change', validateForm));

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        if (bookBtn.disabled) return;
        let selectedSlot = '';
        for (const input of slotInputs) {
          if (input.checked) { selectedSlot = input.value; break; }
        }
        confirmationText.textContent = `Confirmed for ${workshop.value} at ${selectedSlot}. Details sent to ${email.value.trim()}.`;
        confirmation.classList.add('visible');
      });
    })();
  </script>
</body>
</html>
