<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Engineering Summit &mdash; Workshop Booking</title>
<style>
  :root {
    --bg-page: #0a0d14;
    --bg-card: #111726;
    --bg-surface: #182238;
    --border-color: #24324d;
    --border-focus: #38bdf8;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent: #10b981;
    --accent-glow: rgba(16, 185, 129, 0.15);
    --btn-disabled: #1e293b;
    --btn-disabled-text: #475569;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background-color: var(--bg-page);
    color: var(--text-primary);
    font-family: var(--font-sans);
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.25rem 0.75rem;
  }
  .summit-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    width: 100%;
    max-width: 440px;
    padding: 1.75rem;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
  }
  .badge {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--accent);
    background: var(--accent-glow);
    border: 1px solid var(--accent);
    padding: 0.2rem 0.55rem;
    border-radius: 4px;
    margin-bottom: 0.75rem;
  }
  h1 {
    font-size: 1.375rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    margin-bottom: 0.35rem;
  }
  .subtitle {
    font-size: 0.875rem;
    color: var(--text-secondary);
    margin-bottom: 1.5rem;
  }
  .form-group {
    margin-bottom: 1.25rem;
  }
  label, .group-legend {
    display: block;
    font-size: 0.8125rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 0.45rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  select, input[type="email"] {
    width: 100%;
    padding: 0.65rem 0.85rem;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    color: var(--text-primary);
    font-size: 0.9375rem;
    font-family: inherit;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  select:focus-visible, input[type="email"]:focus-visible {
    outline: none;
    border-color: var(--border-focus);
    box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25);
  }
  fieldset {
    border: none;
    padding: 0;
    margin: 0;
  }
  .slots-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
  }
  .slot-option {
    position: relative;
  }
  .slot-option input[type="radio"] {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    margin: 0;
    cursor: pointer;
  }
  .slot-box {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.75rem 0.5rem;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 0.9375rem;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: center;
  }
  .slot-option input[type="radio"]:hover + .slot-box {
    border-color: #3b4d70;
    color: var(--text-primary);
  }
  .slot-option input[type="radio"]:checked + .slot-box {
    background: var(--accent-glow);
    border-color: var(--accent);
    color: var(--accent);
  }
  .slot-option input[type="radio"]:focus-visible + .slot-box {
    outline: none;
    border-color: var(--border-focus);
    box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.35);
  }
  .btn-submit {
    width: 100%;
    padding: 0.8rem 1rem;
    margin-top: 0.5rem;
    font-family: inherit;
    font-size: 0.9375rem;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: var(--accent);
    color: #052e16;
    transition: all 0.15s ease;
  }
  .btn-submit:not(:disabled):hover {
    background: #059669;
    color: #ffffff;
  }
  .btn-submit:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.4);
  }
  .btn-submit:disabled {
    background: var(--btn-disabled);
    color: var(--btn-disabled-text);
    cursor: not-allowed;
    border: 1px solid #1a2233;
  }
  .confirmation-box {
    display: none;
    margin-top: 1.5rem;
    padding: 1.15rem;
    background: rgba(16, 185, 129, 0.08);
    border: 1px solid var(--accent);
    border-radius: 6px;
  }
  .confirmation-box.active {
    display: block;
  }
  .confirmation-header {
    font-size: 0.875rem;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.5rem;
  }
  .confirmation-detail {
    font-size: 0.9375rem;
    color: var(--text-primary);
  }
  .confirmation-detail span {
    font-weight: 600;
    color: #38bdf8;
  }
  .confirmation-note {
    font-size: 0.75rem;
    color: var(--text-secondary);
    margin-top: 0.5rem;
    font-family: var(--font-mono);
  }
  @media (max-width: 390px) {
    body {
      padding: 0.5rem;
    }
    .summit-card {
      padding: 1.25rem;
    }
    h1 {
      font-size: 1.25rem;
    }
  }
</style>
</head>
<body>
<main class="summit-card">
  <div class="badge">SEC-ENG SUMMIT 2026</div>
  <h1>Engineering Summit Booking</h1>
  <p class="subtitle">Secure session registration for credentialed engineers.</p>

  <form id="booking-form" novalidate>
    <div class="form-group">
      <label for="workshop">Workshop</label>
      <select id="workshop" name="workshop" required>
        <option value="">Select a workshop...</option>
        <option value="Threat Modeling">Threat Modeling</option>
        <option value="Secure APIs">Secure APIs</option>
      </select>
    </div>

    <div class="form-group">
      <fieldset>
        <legend class="group-legend">Slot</legend>
        <div class="slots-grid" role="radiogroup" aria-label="Available slots">
          <div class="slot-option">
            <input type="radio" id="slot-1030" name="slot" value="10:30">
            <label class="slot-box" for="slot-1030">10:30</label>
          </div>
          <div class="slot-option">
            <input type="radio" id="slot-1600" name="slot" value="16:00">
            <label class="slot-box" for="slot-1600">16:00</label>
          </div>
        </div>
      </fieldset>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="engineer@enterprise.com" required autocomplete="email">
    </div>

    <button type="submit" id="book-btn" class="btn-submit" disabled>Book Workshop</button>
  </form>

  <div id="confirmation" class="confirmation-box" role="status" aria-live="polite">
    <div class="confirmation-header">Registration Confirmed</div>
    <p class="confirmation-detail">
      Reserved seat in <span id="confirmed-workshop"></span> at <span id="confirmed-slot"></span>.
    </p>
    <p class="confirmation-note">Local session state updated for attendee: <span id="confirmed-email"></span></p>
  </div>
</main>

<script>
(function() {
  const form = document.getElementById('booking-form');
  const workshopSelect = document.getElementById('workshop');
  const emailInput = document.getElementById('email');
  const bookBtn = document.getElementById('book-btn');
  const confirmation = document.getElementById('confirmation');
  const confirmedWorkshop = document.getElementById('confirmed-workshop');
  const confirmedSlot = document.getElementById('confirmed-slot');
  const confirmedEmail = document.getElementById('confirmed-email');

  function validateEmail(email) {
    return emailInput.checkValidity() && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
  }

  function getSelectedSlot() {
    const selected = document.querySelector('input[name="slot"]:checked');
    return selected ? selected.value : null;
  }

  function updateFormState() {
    const hasWorkshop = workshopSelect.value !== '';
    const hasSlot = getSelectedSlot() !== null;
    const isValidEmail = validateEmail(emailInput.value);

    bookBtn.disabled = !(hasWorkshop && hasSlot && isValidEmail);
  }

  workshopSelect.addEventListener('change', updateFormState);
  emailInput.addEventListener('input', updateFormState);
  document.querySelectorAll('input[name="slot"]').forEach(function(radio) {
    radio.addEventListener('change', updateFormState);
  });

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const workshop = workshopSelect.value;
    const slot = getSelectedSlot();
    const email = emailInput.value.trim();

    if (!workshop || !slot || !validateEmail(email)) {
      return;
    }

    confirmedWorkshop.textContent = workshop;
    confirmedSlot.textContent = slot;
    confirmedEmail.textContent = email;
    confirmation.classList.add('active');
    confirmation.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
})();
</script>
</body>
</html>
