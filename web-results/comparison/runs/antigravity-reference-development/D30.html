<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Tool Library - Equipment Reservation</title>
  <style>
    :root {
      --bg: #f5f2eb;
      --surface: #ffffff;
      --border: #d4ccb8;
      --text: #2c251e;
      --muted: #6e6557;
      --wood: #8b4513;
      --wood-hover: #70360e;
      --spruce: #2d4f3b;
      --focus: #c05621;
      --radius: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 24px;
      box-shadow: 0 4px 12px rgba(44, 37, 30, 0.08);
    }
    header {
      border-bottom: 2px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--wood);
      letter-spacing: -0.02em;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }
    select, input[type="email"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 1rem;
      background-color: #fff;
      color: var(--text);
    }
    select:focus, input[type="email"]:focus, input[type="radio"]:focus + span {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    fieldset {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 20px;
    }
    legend {
      padding: 0 6px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .slot-options {
      display: flex;
      gap: 16px;
      margin-top: 6px;
    }
    .slot-label {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 600;
    }
    .slot-label input {
      margin-right: 8px;
    }
    .slot-label:has(input:checked) {
      background-color: #edf2ed;
      border-color: var(--spruce);
      color: var(--spruce);
    }
    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background-color: var(--wood);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    button[type="submit"]:hover:not(:disabled) {
      background-color: var(--wood-hover);
    }
    button[type="submit"]:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    button[type="submit"]:disabled {
      background-color: #c4bcb0;
      cursor: not-allowed;
      opacity: 0.7;
    }
    .confirmation-card {
      margin-top: 24px;
      padding: 16px;
      background-color: #edf2ed;
      border: 1px solid var(--spruce);
      border-radius: var(--radius);
      color: #1b3827;
    }
    .confirmation-card h2 {
      font-size: 1.15rem;
      margin-bottom: 6px;
    }
    .hidden {
      display: none;
    }
    @media (max-width: 480px) {
      .container { padding: 20px 16px; }
      .slot-options { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>Guild & Grove Tool Library</h1>
      <p class="subtitle">Shared equipment for local neighbors and craftspeople</p>
    </header>

    <form id="reservation-form" novalidate>
      <div class="form-group">
        <label for="tool-select">Tool</label>
        <select id="tool-select" required>
          <option value="">Select a workshop tool...</option>
          <option value="Drill">Drill</option>
          <option value="Sander">Sander</option>
        </select>
      </div>

      <div class="form-group">
        <label for="email-input">Email</label>
        <input type="email" id="email-input" placeholder="neighbor@example.com" required>
      </div>

      <fieldset>
        <legend>Reservation Slot</legend>
        <div class="slot-options">
          <label class="slot-label">
            <input type="radio" name="slot" value="09:00" required>
            <span>09:00</span>
          </label>
          <label class="slot-label">
            <input type="radio" name="slot" value="14:00" required>
            <span>14:00</span>
          </label>
        </div>
      </fieldset>

      <button type="submit" id="confirm-button" disabled>Confirm Reservation</button>
    </form>

    <section id="confirmation-message" class="confirmation-card hidden" role="status" aria-live="polite">
      <h2>Reservation Confirmed</h2>
      <p id="confirmation-text"></p>
    </section>
  </main>

  <script>
    (function() {
      const form = document.getElementById('reservation-form');
      const toolSelect = document.getElementById('tool-select');
      const emailInput = document.getElementById('email-input');
      const slotInputs = document.querySelectorAll('input[name="slot"]');
      const confirmBtn = document.getElementById('confirm-button');
      const confirmBox = document.getElementById('confirmation-message');
      const confirmText = document.getElementById('confirmation-text');

      function isValidEmail(val) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val.trim());
      }

      function checkValidity() {
        const toolValid = toolSelect.value === 'Drill' || toolSelect.value === 'Sander';
        const emailValid = isValidEmail(emailInput.value);
        let slotSelected = false;
        for (const r of slotInputs) {
          if (r.checked) { slotSelected = true; break; }
        }
        confirmBtn.disabled = !(toolValid && emailValid && slotSelected);
      }

      toolSelect.addEventListener('change', checkValidity);
      emailInput.addEventListener('input', checkValidity);
      slotInputs.forEach(r => r.addEventListener('change', checkValidity));

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        let chosenSlot = '';
        for (const r of slotInputs) {
          if (r.checked) { chosenSlot = r.value; break; }
        }
        const tool = toolSelect.value;
        confirmText.textContent = `Your reservation for the ${tool} at ${chosenSlot} has been recorded. A pickup confirmation has been sent to ${emailInput.value.trim()}.`;
        confirmBox.classList.remove('hidden');
      });
    })();
  </script>
</body>
</html>
