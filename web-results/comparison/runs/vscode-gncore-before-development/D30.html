<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Common Bench | Reserve a tool</title>
<style>
:root{--paper:#f5f0e8;--ink:#252923;--muted:#667066;--line:#c8c0b3;--accent:#b84d35;--accent-dark:#843525;--ok:#24634b;--focus:#175c9e}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Georgia,serif}main{max-width:760px;margin:auto;padding:clamp(24px,6vw,72px) 20px}header{border-bottom:3px solid var(--ink);padding-bottom:24px;margin-bottom:32px}h1{font:700 clamp(2.2rem,7vw,4.5rem)/.95 "Trebuchet MS",sans-serif;letter-spacing:0;margin:0 0 12px;color:var(--accent-dark)}.kicker{font:700 .75rem/1.2 "Trebuchet MS",sans-serif;letter-spacing:.08em;text-transform:uppercase}.intro{max-width: fiftych;max-width:50ch;color:var(--muted);font-size:1.08rem}.panel{background:#fffaf2;border:1px solid var(--line);border-radius:6px;padding:clamp(20px,5vw,36px);box-shadow:8px 8px 0 #ddd2c2}fieldset{border:0;padding:0;margin:0 0 24px}legend,label{font:700 1rem "Trebuchet MS",sans-serif}legend{margin-bottom:10px}.field{margin-bottom:24px}select,input{display:block;width:100%;margin-top:8px;padding:13px 14px;border:2px solid var(--ink);border-radius:4px;background:white;color:var(--ink);font:1rem Georgia,serif}select:focus,input:focus,button:focus{outline:4px solid var(--focus);outline-offset:3px}.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.slots label{display:flex;align-items:center;justify-content:center;min-height:54px;border:2px solid var(--ink);border-radius:4px;cursor:pointer}.slots input{position:absolute;opacity:0;width:1px;height:1px;margin:0}.slots label:has(input:checked){background:var(--accent);color:white;border-color:var(--accent-dark)}.hint,.error{font-size:.92rem}.hint{color:var(--muted)}.error{color:#8b241f;font-weight:700;min-height:1.4em}button{width:100%;padding:15px 18px;border:2px solid var(--accent-dark);border-radius:4px;background:var(--accent);color:white;font:700 1rem "Trebuchet MS",sans-serif;cursor:pointer}button:disabled{background:#c9c4bc;border-color:#aaa49b;color:#625f59;cursor:not-allowed}.confirmation{margin-top:24px;padding:18px;border-left:6px solid var(--ok);background:#e5f1e8}.confirmation[hidden]{display:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:420px){.slots{grid-template-columns:1fr}.panel{box-shadow:4px 4px 0 #ddd2c2}}
</style>
</head>
<body><main><header><div class="kicker">Common Bench / Neighbors helping neighbors</div><h1>Borrow the good stuff.</h1><p class="intro">Reserve shared workshop equipment for a simple, useful block of time.</p></header><section class="panel" aria-labelledby="reserve-title"><h2 id="reserve-title">Make a reservation</h2><form id="reservation" novalidate><div class="field"><label for="tool">Tool</label><select id="tool" name="tool" required><option value="">Choose a tool</option><option>Drill</option><option>Sander</option></select></div><fieldset><legend>Available time</legend><div class="slots"><label><input type="radio" name="slot" value="09:00" required><span>09:00</span></label><label><input type="radio" name="slot" value="14:00"><span>14:00</span></label></div></fieldset><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error"><div id="email-error" class="error" role="alert"></div></div><button id="confirm" type="submit" disabled>Confirm Reservation</button></form><div id="confirmation" class="confirmation" role="status" aria-live="polite" hidden></div></section></main><script>
const form=document.getElementById('reservation'),tool=document.getElementById('tool'),email=document.getElementById('email'),button=document.getElementById('confirm'),error=document.getElementById('email-error'),confirmation=document.getElementById('confirmation');
function validEmail(){return email.validity.valid&&email.value.trim()!==''}function update(){button.disabled=!(tool.value&&document.querySelector('input[name="slot"]:checked')&&validEmail());if(email.value&&!validEmail())error.textContent='Enter a valid email address.';else error.textContent=''}form.addEventListener('input',update);form.addEventListener('change',update);form.addEventListener('submit',event=>{event.preventDefault();update();if(!form.checkValidity()){form.reportValidity();return}const slot=document.querySelector('input[name="slot"]:checked').value;confirmation.textContent=`Reservation confirmed: ${tool.value} at ${slot}.`;confirmation.hidden=false;confirmation.focus();});
</script></body></html>
