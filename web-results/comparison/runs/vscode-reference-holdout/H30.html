<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signal Room Summit — Workshop booking</title>
<style>
:root{color-scheme:dark;--bg:#0b1115;--panel:#111b20;--line:#29434b;--text:#e9f3f1;--muted:#9bb2b4;--cyan:#73e5dc;--amber:#f2b66d;--danger:#ff8f86}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:clamp(24px,6vw,72px) 20px}.kicker{color:var(--cyan);font:600 .78rem/1.2 ui-monospace,SFMono-Regular,monospace;letter-spacing:.1em;text-transform:uppercase}h1{max-width:11ch;margin:18px 0 12px;font:700 clamp(2.6rem,9vw,5.2rem)/.95 Georgia,serif;letter-spacing:-.05em}p{max-width:62ch;color:var(--muted)}.rule{height:1px;background:var(--line);margin:32px 0}form{background:var(--panel);border:1px solid var(--line);padding:clamp(20px,5vw,36px);position:relative}form:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--amber)}label,legend{display:block;color:var(--text);font-weight:650;margin-bottom:8px}fieldset{border:0;padding:0;margin:0 0 24px}select,input{width:100%;min-height:48px;border:1px solid #45616a;background:#0d171b;color:var(--text);padding:12px;font:inherit;border-radius:3px}input:focus,select:focus,button:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.slots label{border:1px solid #45616a;padding:14px;cursor:pointer}.slots input{width:auto;min-height:auto;margin-right:8px;accent-color:var(--amber)}.slots label:has(input:checked){border-color:var(--amber);color:var(--amber)}button{width:100%;min-height:50px;border:0;border-radius:3px;background:var(--amber);color:#17120c;font-weight:800;font-size:1rem;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.38}.hint{font-size:.88rem;margin-top:8px}.confirm{margin-top:24px;padding:16px;border:1px solid var(--cyan);color:var(--cyan);background:#102328}.confirm[hidden]{display:none}@media(max-width:430px){main{padding:28px 14px}h1{font-size:clamp(2.5rem,15vw,4rem)}.slots{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<div class="kicker">Enterprise security-engineering summit</div>
<h1>Make the signal safer.</h1>
<p>Reserve one focused workshop for a day of practical defense, resilient systems, and clear decisions under pressure.</p>
<div class="rule"></div>
<form id="booking" novalidate>
<fieldset><legend>Workshop</legend><select id="workshop" required aria-describedby="workshopHint"><option value="">Choose a workshop</option><option>Threat Modeling</option><option>Secure APIs</option></select><div id="workshopHint" class="hint">Select one session.</div></fieldset>
<fieldset><legend>Time</legend><div class="slots"><label><input type="radio" name="slot" value="10:30">10:30</label><label><input type="radio" name="slot" value="16:00">16:00</label></div></fieldset>
<fieldset><label for="email">Email</label><input id="email" type="email" autocomplete="email" required placeholder="[you@company.com](mailto:you@company.com)"></fieldset>
<button id="book" type="submit" disabled>Book Workshop</button>
<div id="confirmation" class="confirm" role="status" aria-live="polite" hidden></div>
</form>
</main>
<script>
const form=document.getElementById('booking'),workshop=document.getElementById('workshop'),email=document.getElementById('email'),book=document.getElementById('book'),confirmation=document.getElementById('confirmation');
function refresh(){book.disabled=!(workshop.value&&form.querySelector('input[name="slot"]:checked')&&email.checkValidity())}
form.addEventListener('input',refresh);form.addEventListener('change',refresh);form.addEventListener('submit',e=>{e.preventDefault();if(!form.reportValidity())return;const slot=form.querySelector('input[name="slot"]:checked').value;confirmation.textContent=`Confirmed: ${workshop.value} at ${slot}. A confirmation will be sent to ${email.value}.`;confirmation.hidden=false;confirmation.focus()});
</script>
</body>
</html>
